      "acceptedAnswer": {
        "@type": "Answer",
        "text": "TDEE (Total Daily Energy Expenditure) is the total number of calories your body burns in a day, including your basal metabolic rate (BMR) and physical activity. This calculator uses the Mifflin-St Jeor equation, which is considered the most accurate for estimating BMR: for men, BMR = (10 x weight in kg) + (6.25 x height in cm) - (5 x age) + 5; for women, BMR = (10 x weight in kg) + (6.25 x height in cm) - (5 x age) - 161. The BMR is then multiplied by an activity factor ranging from 1.2 (sedentary) to 1.9 (extra active)."
      }
    },
    {
      "@type": "Question",
      "name": "How much protein do I need per day to build muscle?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For muscle building, research consistently supports consuming 1.6 to 2.2 grams of protein per kilogram of body weight (0.7 to 1.0 grams per pound). This calculator defaults to a higher protein ratio when you select the 'Gain Muscle' goal. Spreading your protein intake across 3 to 5 meals throughout the day, with 20 to 40 grams per meal, optimizes muscle protein synthesis."
      }
    },
    {
      "@type": "Question",
      "name": "What is the best macro ratio for weight loss?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For weight loss, a common and effective macro ratio is 40% protein, 30% carbs, and 30% fat. The higher protein percentage helps preserve lean muscle mass during a calorie deficit, increases satiety (keeping you feeling full), and has a higher thermic effect of food (your body burns more calories digesting protein). This calculator applies a 500-calorie deficit from your TDEE when you select the 'Lose Fat' goal."
      }
    },
    {
      "@type": "Question",
      "name": "Should I eat the same macros on rest days and workout days?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends on your goals and preference. Many people follow the same macros daily for simplicity and consistency. However, some athletes use calorie cycling: eating more carbohydrates on training days (to fuel performance) and fewer carbs on rest days. Protein should remain consistent every day to support muscle repair. If you cycle calories, keep the weekly total the same as your calculated targets."
      }
    },
    {
      "@type": "Question",
      "name": "How accurate are online macro calculators?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Online macro calculators provide a solid starting estimate, typically within 10 to 15 percent of your actual needs. The Mifflin-St Jeor equation used here is the most validated formula for estimating BMR. However, individual factors like genetics, metabolic adaptation, body composition, medications, and hormonal status can affect your actual calorie needs. Use the calculator's numbers as a starting point, track your results for 2 to 3 weeks, and adjust by 100 to 200 calories if you are not seeing expected changes."

  <div class="breadcrumb" aria-label="Breadcrumb">
    <a href="/">Home</a> &rsaquo; <a href="/tools/">Tools</a> &rsaquo; Macronutrient Calculator
  </div>

  <section class="panel">
    <h2>Calculate Your Macros</h2>
    <p class="subtitle">Enter your body stats and goals to get personalized macro targets using the Mifflin-St Jeor equation.</p>

    <div class="form-row cols-2">
      <div class="form-group">
        <label for="mc-sex">Biological Sex</label>
        <select id="mc-sex">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label for="mc-age">Age (years)</label>
        <input type="number" id="mc-age" min="15" max="100" value="30" aria-label="Age in years">
      </div>
    </div>

    <div class="form-row cols-3">
      <div class="form-group">
        <label for="mc-weight">Weight</label>
        <input type="number" id="mc-weight" min="30" max="300" step="0.1" value="70" aria-label="Body weight">
      </div>
      <div class="form-group">
        <label for="mc-weight-unit">Weight Unit</label>
        <select id="mc-weight-unit">
          <option value="kg">Kilograms (kg)</option>
          <option value="lbs">Pounds (lbs)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="mc-height">Height</label>
        <input type="number" id="mc-height" min="100" max="250" step="0.1" value="175" aria-label="Height">
      </div>
    </div>

    <div class="form-row cols-2">
      <div class="form-group">
        <label for="mc-height-unit">Height Unit</label>
        <select id="mc-height-unit">
          <option value="cm">Centimeters (cm)</option>
          <option value="in">Inches (in)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="mc-activity">Activity Level</label>
        <select id="mc-activity">
          <option value="1.2">Sedentary (office job, little exercise)</option>
          <option value="1.375">Lightly Active (1-3 days/week)</option>
          <option value="1.55" selected>Moderately Active (3-5 days/week)</option>
          <option value="1.725">Very Active (6-7 days/week)</option>
          <option value="1.9">Extra Active (athlete, physical job)</option>
        </select>
      </div>
    </div>

    <label style="margin-bottom:8px;">Goal</label>

    <h3 style="font-size:1rem;margin:16px 0 8px;">Adjust Macro Ratios</h3>

      <div class="form-group">
        <label for="mc-protein-pct">Protein: <span id="mc-protein-pct-val">30</span>%</label>
        <input type="range" id="mc-protein-pct" min="10" max="60" value="30" aria-label="Protein percentage">
      </div>

<section class="info-section" aria-label="Macro calculator guide">
  <h2>The Complete Guide to Calculating Your Macronutrients</h2>

  <p>Understanding macronutrients is one of the most powerful tools for managing body composition, athletic performance, and overall health. Unlike simple calorie counting, tracking macros ensures you are getting the right balance of protein, carbohydrates, and fat to support your specific goals. Whether you want to lose body fat while preserving muscle, maintain a healthy weight, or build lean mass, knowing your optimal macro split makes all the difference.</p>

  <h3>What Are Macronutrients?</h3>
  <p>Macronutrients are the three main categories of nutrients that provide energy (calories) to your body. Each macro serves distinct biological functions:</p>
  <ul>
    <li><strong>Protein (4 calories per gram)</strong>, The building block of muscle tissue, enzymes, hormones, and immune cells. Protein has the highest thermic effect of food, meaning your body burns 20-30% of protein calories during digestion. High protein intake supports muscle protein synthesis, satiety, and metabolic rate during caloric restriction.</li>
    <li><strong>Carbohydrates (4 calories per gram)</strong>, Your body's preferred fuel source, especially for high-intensity exercise and brain function. Carbs are stored as glycogen in muscles and liver. Complex carbohydrates from whole grains, vegetables, and legumes provide sustained energy, fiber, and micronutrients.</li>
    <li><strong>Fat (9 calories per gram)</strong>, Essential for hormone production (including testosterone and estrogen), vitamin absorption (A, D, E, K), cell membrane integrity, and brain health. Fat is the most calorie-dense macronutrient, making it important to measure accurately when tracking intake.</li>
  </ul>

  <h3>How the Mifflin-St Jeor Equation Works</h3>
  <p>This calculator uses the Mifflin-St Jeor equation, which research published in the Journal of the American Dietetic Association found to be the most accurate predictive equation for estimating resting metabolic rate in both normal-weight and obese individuals. The formula calculates your Basal Metabolic Rate (BMR), the calories your body burns at complete rest to maintain basic life functions like breathing, circulation, and cell repair.</p>
  <p>For men, the equation is: BMR = (10 &times; weight in kg) + (6.25 &times; height in cm) - (5 &times; age in years) + 5. For women: BMR = (10 &times; weight in kg) + (6.25 &times; height in cm) - (5 &times; age in years) - 161. The BMR is then multiplied by your activity factor to determine your Total Daily Energy Expenditure (TDEE), which represents the actual number of calories you burn each day including physical activity.</p>

  <h3>Choosing Your Goal, Deficit, Maintenance, or Surplus</h3>
  <p>Your TDEE forms the baseline for setting calorie targets. To lose fat, you need to eat fewer calories than you burn (caloric deficit). To gain muscle, you need a modest surplus. The key variables are:</p>
  <ul>
    <li><strong>Fat loss (deficit of 500 calories/day)</strong>, A 500-calorie daily deficit creates approximately a 1 pound per week loss, which research shows is optimal for preserving lean mass. Going more aggressive (750-1000 calories) speeds fat loss but increases the risk of muscle loss, metabolic adaptation, and adherence failure.</li>
    <li><strong>Maintenance</strong>, Eating at your TDEE maintains current body weight. This phase is useful for building healthy habits, recomposition (slowly building muscle while losing fat), or transitioning between cut and bulk phases.</li>
    <li><strong>Muscle gain (surplus of 300 calories/day)</strong>, A lean bulk of 300 calories minimizes fat gain while providing enough extra energy to support muscle growth. Beginners can gain muscle even at maintenance or slight deficit, but intermediate and advanced lifters benefit from a deliberate surplus.</li>
  </ul>

  <h3>Optimizing Your Macro Ratios</h3>
  <p>There is no single perfect macro ratio. The optimal split depends on your goal, training style, food preferences, and metabolic response. However, evidence-based guidelines provide excellent starting points:</p>
  <ul>
    <li>Fat loss. 40% protein, 30% carbs, 30% fat. The elevated protein protects muscle during restriction, and moderate fat supports hormonal health.</li>
    <li>Maintenance. 30% protein, 40% carbs, 30% fat. A balanced approach that fuels daily activity while meeting protein needs for tissue repair.</li>
    <li>Muscle gain. 30% protein, 45% carbs, 25% fat. Higher carbs fuel intense training, replenish glycogen, and support anabolic hormone production. Protein at 1.6-2.2g/kg is sufficient for maximizing muscle protein synthesis.</li>
  </ul>

  <h3>Meal Timing and Frequency</h3>
  <p>While total daily macro intake matters most, meal timing can provide a small but meaningful edge. Research on muscle protein synthesis (MPS) shows that consuming 20-40 grams of protein per meal, spread across 3-5 meals daily, maximizes the anabolic response compared to consuming the same total in fewer, larger meals. Post-workout nutrition within 2 hours of training, combining protein and carbohydrates, accelerates glycogen replenishment and muscle recovery.</p>
  <p>For fat loss, some individuals benefit from front-loading calories earlier in the day when insulin sensitivity is naturally higher. For muscle gain, distributing carbohydrates around training sessions (pre- and post-workout) can enhance performance and recovery without excessive fat storage.</p>

  <h3>Common Mistakes When Tracking Macros</h3>
  <p>Even with accurate calculations, several pitfalls can derail your progress. First, not weighing food with a kitchen scale leads to significant underestimation of portions, studies show people underreport calorie intake by 30-50% when estimating visually. Second, forgetting to count cooking oils, sauces, dressings, and beverages can add 200-500 untracked calories daily. Third, relying solely on scale weight without accounting for water retention, menstrual cycle fluctuations, and glycogen shifts causes unnecessary frustration. Use weekly averages and body measurements alongside the scale for a complete picture.</p>
  <p>Finally, remember that all calculator outputs are estimates. Your actual metabolic rate is influenced by genetics, sleep quality, stress, non-exercise activity thermogenesis (NEAT), gut microbiome, and previous dieting history. Treat the numbers as a starting framework, track your results for 2-3 weeks, and adjust by 100-200 calories if progress stalls or exceeds expectations.</p>

  <div class="info-grid">
    <article class="info-card">
      <h3>&#9878; Protein Priority</h3>
      <p>Set protein first (1.6-2.2g/kg for active individuals), then divide remaining calories between carbs and fat based on your training and food preferences.</p>
    </article>
    <article class="info-card">
      <h3>&#9878; Weigh Your Food</h3>
      <p>A kitchen scale is the single most impactful tool for accurate tracking. Measuring cups are convenient but can vary 15-30% from actual weight.</p>
    </article>
    <article class="info-card">
      <h3>&#9878; Consistency Over Perfection</h3>
      <p>Hitting your macros within 5-10g daily is sufficient. Obsessing over exact numbers increases stress without meaningful benefit for most people.</p>
    </article>
    <article class="info-card">
      <h3>&#9878; Reassess Every 4-6 Weeks</h3>
      <p>As your weight changes, your TDEE changes too. Recalculate your macros periodically, especially after losing or gaining 5+ pounds.</p>
    </article>
  </div>

<script>
"use strict";
(function () {

  /* ---- Goal selection ---- */
  var goalCards = document.querySelectorAll('.goal-card');
  var currentGoal = 'maintain';

  var goalPresets = {
    lose:     { protein: 40, carbs: 30, fat: 30, offset: -500 },
    maintain: { protein: 30, carbs: 40, fat: 30, offset: 0 },
    gain:     { protein: 30, carbs: 45, fat: 25, offset: 300 }
  };

  function setGoal(goal) {
    if (!goalPresets[goal]) return;
    currentGoal = goal;
    goalCards.forEach(function (c) {
      var isActive = c.getAttribute('data-goal') === goal;
      c.classList.toggle('active', isActive);
      c.setAttribute('aria-checked', isActive ? 'true' : 'false');
    });
    var p = goalPresets[goal];
    document.getElementById('mc-protein-pct').value = p.protein;
    document.getElementById('mc-carbs-pct').value = p.carbs;
    document.getElementById('mc-fat-pct').value = p.fat;
    updateSliderLabels();
  }

  goalCards.forEach(function (card) {
    card.addEventListener('click', function () { setGoal(card.getAttribute('data-goal')); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setGoal(card.getAttribute('data-goal')); }
    });
  });

  /* ---- Slider sync ---- */
  function updateSliderLabels() {
    var p = parseInt(document.getElementById('mc-protein-pct').value, 10);
    var c = parseInt(document.getElementById('mc-carbs-pct').value, 10);
    var f = parseInt(document.getElementById('mc-fat-pct').value, 10);
    document.getElementById('mc-protein-pct-val').textContent = p;
    document.getElementById('mc-carbs-pct-val').textContent = c;
    document.getElementById('mc-fat-pct-val').textContent = f;
    var total = p + c + f;
    document.getElementById('mc-ratio-warn').style.display = (total !== 100) ? 'block' : 'none';
  }

  ['mc-protein-pct', 'mc-carbs-pct', 'mc-fat-pct'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', updateSliderLabels);
  });

  /* ---- Calculation ---- */
  function calculate() {
    var sex = document.getElementById('mc-sex').value;
    var age = parseFloat(document.getElementById('mc-age').value);
    var weight = parseFloat(document.getElementById('mc-weight').value);
    var weightUnit = document.getElementById('mc-weight-unit').value;
    var height = parseFloat(document.getElementById('mc-height').value);
    var heightUnit = document.getElementById('mc-height-unit').value;
    var activity = parseFloat(document.getElementById('mc-activity').value);

    if (isNaN(age) || isNaN(weight) || isNaN(height)) return;
    if (age < 15 || age > 100) return;

    var weightKg = weightUnit === 'lbs' ? weight * 0.453592 : weight;
    var heightCm = heightUnit === 'in' ? height * 2.54 : height;

    /* Mifflin-St Jeor */
    var bmr;
    if (sex === 'male') {
      bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) + 5;
    } else {
      bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) - 161;
    }

    var tdee = Math.round(bmr * activity);
    var offset = goalPresets[currentGoal] ? goalPresets[currentGoal].offset : 0;
    var targetCal = Math.max(1200, tdee + offset);

    var proteinPct = parseInt(document.getElementById('mc-protein-pct').value, 10);
    var carbsPct = parseInt(document.getElementById('mc-carbs-pct').value, 10);
    var fatPct = parseInt(document.getElementById('mc-fat-pct').value, 10);

    if (proteinPct + carbsPct + fatPct !== 100) {
      document.getElementById('mc-ratio-warn').style.display = 'block';
      return;
    }

    var proteinCal = Math.round(targetCal * proteinPct / 100);
    var carbsCal = Math.round(targetCal * carbsPct / 100);
    var fatCal = Math.round(targetCal * fatPct / 100);

    var proteinG = Math.round(proteinCal / 4);
    var carbsG = Math.round(carbsCal / 4);
    var fatG = Math.round(fatCal / 9);

    /* Display */
    document.getElementById('mc-tdee').textContent = tdee.toLocaleString();
    document.getElementById('mc-target-cal').textContent = targetCal.toLocaleString();
    document.getElementById('mc-bmr').textContent = Math.round(bmr).toLocaleString();

    document.getElementById('mc-protein-g').textContent = proteinG;
    document.getElementById('mc-protein-cal').textContent = proteinCal;
    document.getElementById('mc-protein-pct-display').textContent = proteinPct + '%';
    document.getElementById('mc-protein-bar').style.width = proteinPct + '%';

    document.getElementById('mc-carbs-g').textContent = carbsG;
    document.getElementById('mc-carbs-cal').textContent = carbsCal;
    document.getElementById('mc-carbs-pct-display').textContent = carbsPct + '%';
    document.getElementById('mc-carbs-bar').style.width = carbsPct + '%';

    document.getElementById('mc-fat-g').textContent = fatG;
    document.getElementById('mc-fat-cal').textContent = fatCal;
    document.getElementById('mc-fat-pct-display').textContent = fatPct + '%';
    document.getElementById('mc-fat-bar').style.width = fatPct + '%';

    /* Protein per body weight */
    var gPerKg = (proteinG / weightKg).toFixed(1);
    var gPerLb = (proteinG / (weightKg * 2.20462)).toFixed(1);
    document.getElementById('mc-protein-per-weight').textContent =
      proteinG + 'g protein = ' + gPerKg + 'g/kg (' + gPerLb + 'g/lb) of body weight. ' +
      (parseFloat(gPerKg) >= 1.6 ? 'This is within the optimal 1.6-2.2g/kg range for muscle building.' :
       parseFloat(gPerKg) >= 1.2 ? 'This is adequate for general fitness. Consider increasing to 1.6g/kg+ for muscle building.' :
       'This is below recommendations for active individuals. Consider increasing protein percentage.');

    /* Meal timing */
    generateMealPlan(targetCal, proteinG, carbsG, fatG);

    var results = document.getElementById('mc-results');
    results.classList.add('visible');
    results.style.display = 'block';
    results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function generateMealPlan(totalCal, totalP, totalC, totalF) {
    var mealsContainer = document.getElementById('mc-meals');
    var meals;

    if (totalCal < 1600) {
      meals = [
        { time: '8:00 AM', name: 'Breakfast', pct: 0.30 },
        { time: '12:30 PM', name: 'Lunch', pct: 0.35 },
        { time: '6:30 PM', name: 'Dinner', pct: 0.35 }
      ];
    } else if (totalCal < 2200) {
      meals = [
        { time: '7:30 AM', name: 'Breakfast', pct: 0.25 },
        { time: '10:30 AM', name: 'Morning Snack', pct: 0.10 },
        { time: '12:30 PM', name: 'Lunch', pct: 0.30 },
        { time: '6:30 PM', name: 'Dinner', pct: 0.35 }
      ];
    } else {
      meals = [
        { time: '7:00 AM', name: 'Breakfast', pct: 0.22 },
        { time: '10:00 AM', name: 'Morning Snack', pct: 0.10 },
        { time: '12:30 PM', name: 'Lunch', pct: 0.28 },
        { time: '3:30 PM', name: 'Afternoon Snack', pct: 0.12 },
        { time: '7:00 PM', name: 'Dinner', pct: 0.28 }
      ];
    }

    var html = '';
    for (var i = 0; i < meals.length; i++) {
      var m = meals[i];
      var mCal = Math.round(totalCal * m.pct);
      var mP = Math.round(totalP * m.pct);
      var mC = Math.round(totalC * m.pct);
      var mF = Math.round(totalF * m.pct);
      html += '<div class="meal-item">' +
        '<div class="meal-time">' + m.time + '</div>' +
        '<div><div class="meal-name">' + m.name + ' (' + mCal + ' kcal)</div>' +
        '<div class="meal-macros">Protein: ' + mP + 'g &middot; Carbs: ' + mC + 'g &middot; Fat: ' + mF + 'g</div></div>' +
        '</div>';
    }
    mealsContainer.innerHTML = html;
  }

  document.getElementById('mc-calc').addEventListener('click', calculate);

  document.getElementById('mc-reset').addEventListener('click', function () {
    document.getElementById('mc-sex').value = 'male';
    document.getElementById('mc-age').value = '30';
    document.getElementById('mc-weight').value = '70';
    document.getElementById('mc-weight-unit').value = 'kg';
    document.getElementById('mc-height').value = '175';
    document.getElementById('mc-height-unit').value = 'cm';
    document.getElementById('mc-activity').value = '1.55';
    setGoal('maintain');
    document.getElementById('mc-results').classList.remove('visible');
    document.getElementById('mc-results').style.display = 'none';
  });

  /* Auto-calculate on enter */
  document.querySelectorAll('#mc-age, #mc-weight, #mc-height').forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); calculate(); }
    });
  });

})();
</script>
